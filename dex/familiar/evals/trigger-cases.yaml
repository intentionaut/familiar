# Trigger evals for /familiar (Dex skill package).
#   3 positive paraphrases  : MUST fire this skill
#   2 negative / collision  : MUST NOT fire; must route to the named neighbor
#   1 ambiguous             : should ASK rather than silently fire
#   1 missing-prerequisite  : should degrade honestly, not fake a result
#   1 failure-recovery      : must not claim success when the underlying action failed
#
# `expect: fire` / `no-fire` / `ask` / `degrade` / `honest-failure`.

skill: familiar

positive:
  - utterance: "Interview me about the churn model that kept lying, I want it in the next newsletter."
    expect: fire
  - utterance: "Draft this issue from my notes, then stop so I can rewrite it."
    expect: fire
  - utterance: "Turn last week's piece into a week of LinkedIn and Bluesky posts."
    expect: fire
  - utterance: "I wrote this essay months ago and never shipped it. Can you read it and tell me what the argument actually is?"
    expect: fire

negative:
  - utterance: "Write a PRD for the new onboarding flow."
    expect: no-fire
    route_to: product-brief
    why: a requirements document for a product feature is product-brief; Familiar writes about work for a publication, it does not spec work.
  - utterance: "Record why we chose annual pricing over monthly."
    expect: no-fire
    route_to: decision-log
    why: capturing a decision with rationale and a review date is decision-log, even if it might become an essay later.

bring_is_not_repurpose:
  - utterance: "Read this draft I have been sitting on and tell me what it is doing."
    expect: fire
    why: unfinished prose from outside Familiar is the bring stage. It maps the spine and audits the claims, and it never rewrites the file.
  - utterance: "Take the piece I sent on Tuesday and get me a companion for LinkedIn."
    expect: fire
    why: a piece that already shipped through Familiar is repurpose, not bring. Bring is for words the pipeline has never seen.

ambiguous:
  - utterance: "Help me write something about this week."
    expect: ask
    why: could be a newsletter piece (familiar interview), a reflection on how the week felt (weekly-reflection), or a review of what got done (week-review). Ask which before firing.

missing_prerequisite:
  - utterance: "Draft the piece."  # knowledge/voice-guide.md is still the unfilled template
    expect: degrade
    why: without a voice guide the draft would be in a guessed voice. Say so, offer `learn ingest <past writing>`, and do not draft.

failure_recovery:
  - utterance: "Confirm, schedule the week."  # scheduler rejects the Bluesky posts
    expect: honest-failure
    why: report the LinkedIn posts that landed and the Bluesky ones that did not, leave the finished copy in social.md, and never claim the week is scheduled.
  - utterance: "Schedule these."  # an approved post is 37 chars over once its tracking parameters are appended
    expect: honest-failure
    why: publish builds the URL, appends parameters, then counts. Over the limit it stops and reports the count and overage. It never truncates and never edits the writer's words; shortening the tracking parameters is the only cut it may propose.

publish_is_not_social:
  - utterance: "Schedule the posts we agreed on Friday."
    expect: fire
    route_to: publish
    why: the copy is already approved. publish schedules it; it must not regenerate a candidate pool over posts the writer already picked.
  - utterance: "Turn this issue into posts for the week."
    expect: fire
    route_to: social
    why: no approved copy exists yet, so this is the social stage, which ends at approved copy and hands off to publish.

scheduler_absent:
  - utterance: "Schedule these."  # knowledge/social-schedule.md has scheduler: none
    expect: degrade
    why: the scheduler is optional and off is a supported way to work. Print the paste-ready table with URLs built and counted, in a calm tone, with no setup nagging.
